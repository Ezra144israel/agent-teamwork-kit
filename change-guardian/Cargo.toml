[package]
name = "change-guardian"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic change-containment enforcement for coding agents"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
